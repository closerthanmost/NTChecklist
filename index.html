  <style>
    :root {
      --nt-green: #0a3d24;
      --nt-dark-green: #062617;
      --nt-gold: #c99e32;
      --nt-cream: #f7f6f0;
      --nt-card-bg: #ffffff;
      --nt-text-main: #1f2937;
      --nt-text-muted: #6b7280;
      --nt-border: #e5e7eb;
      --status-visited: #15803d;
      --status-wishlist: #b45309;
      --radius: 8px;
      --shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--nt-cream);
      color: var(--nt-text-main);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, var(--nt-dark-green) 0%, var(--nt-green) 100%);
      color: #fff;
      padding: 2rem 1.5rem;
      border-bottom: 4px solid var(--nt-gold);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 2.1rem;
      letter-spacing: 0.5px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 0.2rem;
    }

    /* Auth Box */
    .auth-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(255, 255, 255, 0.12);
      padding: 0.5rem 0.9rem;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .auth-user-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #fff;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--nt-gold);
    }

    .btn-auth {
      background: #fff;
      color: var(--nt-dark-green);
      border: none;
      padding: 0.45rem 1rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: background 0.15s ease;
    }

    .btn-auth:hover {
      background: var(--nt-cream);
    }

    /* Progress Tracker */
    .progress-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 1rem;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .progress-bar-track {
      background: rgba(0, 0, 0, 0.3);
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--nt-gold);
      width: 0%;
      transition: width 0.3s ease;
    }

    .stat-pills {
      display: flex;
      gap: 1.5rem;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
      flex-wrap: wrap;
    }

    .stat-pill strong {
      color: #fff;
      font-weight: 700;
    }

    /* Main Container & Controls */
    main {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .controls-panel {
      background: #fff;
      padding: 1.25rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 1rem;
      align-items: center;
    }

    @media (max-width: 900px) {
      .controls-panel { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 550px) {
      .controls-panel { grid-template-columns: 1fr; }
    }

    .control-field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--nt-text-muted);
      margin-bottom: 0.3rem;
    }

    input[type="search"], select {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--nt-border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      background: #fff;
    }

    .backup-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-bottom: 1rem;
    }

    .btn-secondary {
      background: #fff;
      color: var(--nt-green);
      border: 1px solid var(--nt-green);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: var(--nt-green);
      color: #fff;
    }

    /* Location Accordion */
    .location-group {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 1.25rem;
      border: 1px solid var(--nt-border);
      overflow: hidden;
    }

    .location-header {
      padding: 1rem 1.25rem;
      background: #fff;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .location-header:hover {
      background: #fdfdfa;
    }

    .location-header.open {
      border-bottom: 1px solid var(--nt-border);
      background: #fafaf5;
    }

    .location-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .location-name {
      font-family: 'Cinzel', Georgia, serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--nt-green);
    }

    .location-counter {
      font-size: 0.8rem;
      font-weight: 600;
      background: #eef2ea;
      color: var(--nt-green);
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
    }

    .chevron {
      transition: transform 0.2s ease;
      font-size: 0.8rem;
      color: var(--nt-text-muted);
    }

    .open .chevron {
      transform: rotate(180deg);
    }

    .location-content {
      padding: 1.2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.2rem;
    }

    .hidden { display: none !important; }

    /* Site Card */
    .site-card {
      border: 1px solid var(--nt-border);
      background: #fff;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .site-card:hover {
      box-shadow: 0 6px 14px rgba(0,0,0,0.1);
      transform: translateY(-2px);
    }

    .site-card.visited {
      background-color: #f6fbf8;
      border-left: 5px solid var(--status-visited);
    }

    .site-card.wishlist {
      background-color: #fdfaf5;
      border-left: 5px solid var(--status-wishlist);
    }

    .site-thumb-wrap {
      width: 100%;
      height: 175px;
      background-color: #e2e8f0;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .site-thumb-wrap::before {
      content: attr(data-placeholder);
      position: absolute;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      padding: 0 1rem;
    }

    .site-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .site-thumb.loaded {
      opacity: 1;
    }

    .site-card:hover .site-thumb.loaded {
      transform: scale(1.04);
    }

    .site-card-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .site-name {
      font-size: 1.02rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 0.2rem;
      line-height: 1.3;
    }

    .site-meta {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .site-sublocation {
      font-size: 0.75rem;
      color: var(--nt-text-muted);
      font-weight: 500;
    }

    .site-category {
      font-size: 0.68rem;
      color: var(--nt-green);
      background: #eef2ea;
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nt-button {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--nt-green);
      background: #ecfdf5;
      border: 1px solid rgba(10, 61, 36, 0.25);
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      text-decoration: none;
      margin-bottom: 0.8rem;
      width: fit-content;
      transition: all 0.15s ease;
    }

    .nt-button:hover {
      background: var(--nt-green);
      color: #fff;
    }

    .site-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .status-btn {
      flex: 1;
      padding: 0.45rem 0.5rem;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 5px;
      border: 1px solid var(--nt-border);
      background: #fdfdfd;
      color: var(--nt-text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .status-btn:hover {
      background: #f3f4f6;
    }

    .status-btn.active-visited {
      background: var(--status-visited);
      color: #fff;
      border-color: var(--status-visited);
    }

    .status-btn.active-wishlist {
      background: var(--status-wishlist);
      color: #fff;
      border-color: var(--status-wishlist);
    }

    .site-date-badge {
      font-size: 0.72rem;
      color: var(--status-visited);
      font-weight: 600;
      margin-top: 0.3rem;
    }
  </style>
</head>

      { region: "Wales", location: "South Wales", sub: "near Cardiff", name: "Dyffryn Gardens", category: "Garden", wiki: "Dyffryn Gardens", slug: "wales/dyffryn-gardens" },
      { region: "Wales", location: "South Wales", sub: "Gower Peninsula", name: "Rhossili and South Gower Coast", category: "Countryside", wiki: "Rhossili", slug: "wales/rhossili-and-south-gower-coast" },
      { region: "Wales", location: "South Wales", sub: "Neath", name: "Aberdulais", category: "Historic Property", wiki: "Aberdulais Falls", slug: "wales/aberdulais" },
      { region: "Wales", location: "South Wales", sub: "Abergavenny", name: "Sugar Loaf and Usk Valley", category: "Countryside", wiki: "Sugar Loaf, Monmouthshire", slug: "wales/sugar-loaf-and-usk-valley" },
      { region: "Wales", location: "South Wales", sub: "near Monmouth", name: "Skenfrith Castle", category: "Castle", wiki: "Skenfrith Castle", slug: "wales/skenfrith-castle" },

      // West Wales
      { region: "Wales", location: "West Wales", sub: "Llandeilo", name: "Dinefwr", category: "Historic House", wiki: "Dinefwr Castle", slug: "wales/dinefwr" },
      { region: "Wales", location: "West Wales", sub: "near Aberaeron", name: "Llanerchaeron", category: "Historic House", wiki: "Llanerchaeron", slug: "wales/llanerchaeron" },
      { region: "Wales", location: "West Wales", sub: "near Pumsaint", name: "Dolaucothi Gold Mines", category: "Roman", wiki: "Dolaucothi Gold Mines", slug: "wales/dolaucothi" },
      { region: "Wales", location: "West Wales", sub: "Pembrokeshire", name: "Stackpole and Barafundle Bay", category: "Garden", wiki: "Stackpole Estate", slug: "wales/stackpole" },
      { region: "Wales", location: "West Wales", sub: "near Amroth", name: "Colby Woodland Garden", category: "Garden", wiki: "Colby Woodland Garden", slug: "wales/colby-woodland-garden" },
      { region: "Wales", location: "West Wales", sub: "Tenby", name: "Tudor Merchant's House", category: "Historic House", wiki: "Tudor Merchant's House", slug: "wales/tudor-merchants-house" },
      { region: "Wales", location: "West Wales", sub: "near Cardigan", name: "Cilgerran Castle", category: "Castle", wiki: "Cilgerran Castle", slug: "wales/cilgerran-castle" },
      { region: "Wales", location: "West Wales", sub: "near Cardigan", name: "Mwnt", category: "Countryside", wiki: "Mwnt", slug: "wales/mwnt" },
      { region: "Wales", location: "West Wales", sub: "St Davids", name: "St David's Peninsula & Solva Coast", category: "Countryside", wiki: "St Davids", slug: "wales/st-davids-peninsula" }
    ];

    function generateId(site) {
      return (site.location + "_" + site.name).toLowerCase().replace(/[^a-z0-9]/g, "_");
    }

    const sites = RAW_DATA.map(item => ({
      ...item,
      id: generateId(item),
      ntUrl: `https://www.nationaltrust.org.uk/visit/${item.slug}`
    }));

    // ----------------------------------------------------
    // 3. STORAGE & STATE MANAGEMENT
    // ----------------------------------------------------
    const LOCAL_KEY = "nt_checklist_progress";
    let userData = {};

    function saveState() {
      try {
        localStorage.setItem(LOCAL_KEY, JSON.stringify(userData));
      } catch (e) {
        console.error("Local save error:", e);
      }

      if (currentUser && db) {
        db.collection("users").doc(currentUser.uid).set({
          checklist: userData,
          lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true })
        .catch(err => {
          console.error("Cloud save failed:", err);
        });
      }

      updateStats();
    }

    function setStatus(id, newStatus) {
      if (!userData[id]) userData[id] = {};
      
      if (userData[id].status === newStatus) {
        delete userData[id].status;
        delete userData[id].date;
      } else {
        userData[id].status = newStatus;
        if (newStatus === "visited") {
          const d = new Date();
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          userData[id].date = `${year}-${month}-${day}`;
        }
      }
      saveState();
      renderSites();
    }

    // ----------------------------------------------------
    // 4. AUTHENTICATION LOGIC
    // ----------------------------------------------------
    const authBox = document.getElementById("authBox");

    function renderAuthUI() {
      if (currentUser) {
        authBox.innerHTML = `
          <div class="auth-user-info">
            ${currentUser.photoURL ? `<img src="${currentUser.photoURL}" class="user-avatar" alt="Profile">` : ''}
            <span>${currentUser.displayName || currentUser.email}</span>
          </div>
          <button class="btn-auth" id="logoutBtn">Sign Out</button>
        `;

        document.getElementById("logoutBtn").addEventListener("click", () => {
          auth.signOut().then(() => {
            userData = {};
            try {
              localStorage.removeItem(LOCAL_KEY);
            } catch (e) {
              console.warn("Storage clear failed:", e);
            }
            renderSites();
            updateStats();
          }).catch(err => {
            console.error("Sign out error:", err);
          });
        });
      } else {
        authBox.innerHTML = `
          <button class="btn-auth" id="loginBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/></svg>
            Sign in with Google
          </button>
        `;

        document.getElementById("loginBtn").addEventListener("click", loginWithGoogle);
      }
    }

    function loginWithGoogle() {
      if (!auth) {
        alert("Firebase is not initialized.");
        return;
      }

      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).catch(error => {
        console.error("Google Auth Error:", error);
        alert(`Authentication Error (${error.code}):\n${error.message}`);
      });
    }

    if (auth) {
      auth.onAuthStateChanged(user => {
        currentUser = user;
        renderAuthUI();

        if (user && db) {
          db.collection("users").doc(user.uid).get()
            .then(doc => {
              if (doc.exists && doc.data().checklist) {
                userData = doc.data().checklist;
              } else {
                userData = {};
              }
              try {
                localStorage.setItem(LOCAL_KEY, JSON.stringify(userData));
              } catch(e) {}
              renderSites();
              updateStats();
            })
            .catch(err => {
              console.error("Error reading Firestore:", err);
            });
        } else {
          userData = {};
          try {
            localStorage.removeItem(LOCAL_KEY);
          } catch(e) {}
          renderSites();
          updateStats();
        }
      });
    }

    // ----------------------------------------------------
    // 5. BATCH IMAGE LOADER & PERSISTENT CACHE
    // ----------------------------------------------------
    const PHOTO_CACHE_KEY = "nt_property_photos_v7";
    let photoCache = {};
    try {
      const stored = localStorage.getItem(PHOTO_CACHE_KEY);
      if (stored) photoCache = JSON.parse(stored);
    } catch(e) {}

    function savePhotoCache() {
      try {
        localStorage.setItem(PHOTO_CACHE_KEY, JSON.stringify(photoCache));
      } catch(e) {}
    }

    function applyImageToElement(siteId, url) {
      const img = document.getElementById(`img_${siteId}`);
      if (img) {
        img.src = url;
        img.onload = () => img.classList.add("loaded");
      }
    }

    function loadAllPropertyPhotos() {
      const needed = sites.filter(s => !photoCache[s.id]);
      if (needed.length === 0) return;

      const BATCH_SIZE = 45;
      for (let i = 0; i < needed.length; i += BATCH_SIZE) {
        const chunk = needed.slice(i, i + BATCH_SIZE);
        const titles = chunk.map(s => encodeURIComponent(s.wiki || s.name)).join("|");
        const url = `https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&pithumbsize=640&redirects=1&format=json&origin=*&titles=${titles}`;

        fetch(url)
          .then(res => res.json())
          .then(data => {
            if (data && data.query && data.query.pages) {
              const pages = data.query.pages;
              const titleToImg = {};
              
              Object.values(pages).forEach(p => {
                if (p.thumbnail && p.thumbnail.source) {
                  titleToImg[p.title.toLowerCase()] = p.thumbnail.source;
                }
              });

              if (data.query.redirects) {
                data.query.redirects.forEach(r => {
                  if (titleToImg[r.to.toLowerCase()]) {
                    titleToImg[r.from.toLowerCase()] = titleToImg[r.to.toLowerCase()];
                  }
                });
              }

              chunk.forEach(s => {
                const targetKey = (s.wiki || s.name).toLowerCase();
                const matchedImg = titleToImg[targetKey];
                if (matchedImg) {
                  photoCache[s.id] = matchedImg;
                  applyImageToElement(s.id, matchedImg);
                }
              });

              savePhotoCache();
            }
          })
          .catch(err => {
            console.warn("Batch image loading skipped:", err);
          });
      }
    }

    // ----------------------------------------------------
    // 6. RENDERING & UI
    // ----------------------------------------------------
    function updateStats() {
      const total = sites.length;
      let visitedCount = 0;
      let wishlistCount = 0;

      sites.forEach(s => {
        const u = userData[s.id];
        if (u && u.status === "visited") visitedCount++;
        else if (u && u.status === "wishlist") wishlistCount++;
      });

      const unvisitedCount = total - visitedCount - wishlistCount;
      const pct = total > 0 ? Math.round((visitedCount / total) * 100) : 0;

      document.getElementById("statTotal").textContent = total;
      document.getElementById("statVisited").textContent = visitedCount;
      document.getElementById("statWishlist").textContent = wishlistCount;
      document.getElementById("statUnvisited").textContent = unvisitedCount;
      document.getElementById("progressPercent").textContent = `${pct}%`;
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    function populateFilterDropdowns() {
      const categorySelect = document.getElementById("filterCategory");
      const locationSelect = document.getElementById("filterLocation");

      const categories = [...new Set(sites.map(s => s.category))].sort();
      categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.textContent = cat;
        categorySelect.appendChild(opt);
      });

      const regions = [...new Set(sites.map(s => s.region))].sort();
      regions.forEach(reg => {
        const optGroup = document.createElement("optgroup");
        optGroup.label = reg;

        const locsInReg = [...new Set(sites.filter(s => s.region === reg).map(s => s.location))].sort();
        locsInReg.forEach(loc => {
          const opt = document.createElement("option");
          opt.value = loc;
          opt.textContent = `${loc} (${reg})`;
          optGroup.appendChild(opt);
        });

        locationSelect.appendChild(optGroup);
      });
    }

    function renderSites() {
      const container = document.getElementById("siteListContainer");
      const noMatches = document.getElementById("noMatches");
      const q = document.getElementById("search").value.trim().toLowerCase();
      const statusFilter = document.getElementById("filterStatus").value;
      const catFilter = document.getElementById("filterCategory").value;
      const locFilter = document.getElementById("filterLocation").value;

      const filtered = sites.filter(site => {
        const u = userData[site.id] || {};
        const currentStatus = u.status || "unvisited";

        if (statusFilter !== "all" && currentStatus !== statusFilter) return false;
        if (catFilter !== "all" && site.category !== catFilter) return false;
        if (locFilter !== "all" && site.location !== locFilter) return false;

        if (q) {
          const matchName = site.name.toLowerCase().includes(q);
          const matchLoc = site.location.toLowerCase().includes(q);
          const matchReg = site.region.toLowerCase().includes(q);
          const matchSub = (site.sub || "").toLowerCase().includes(q);
          const matchCat = site.category.toLowerCase().includes(q);
          if (!matchName && !matchLoc && !matchReg && !matchSub && !matchCat) return false;
        }
        return true;
      });

      container.innerHTML = "";

      if (filtered.length === 0) {
        noMatches.classList.remove("hidden");
        return;
      }
      noMatches.classList.add("hidden");

      const grouped = {};
      filtered.forEach(s => {
        const groupTitle = `${s.location} — ${s.region}`;
        if (!grouped[groupTitle]) grouped[groupTitle] = [];
        grouped[groupTitle].push(s);
      });

      const sortedGroupTitles = Object.keys(grouped).sort();

      sortedGroupTitles.forEach(groupTitle => {
        const groupSites = grouped[groupTitle];
        
        const groupEl = document.createElement("div");
        groupEl.className = "location-group";

        const headerEl = document.createElement("div");
        headerEl.className = "location-header open";

        const visitedInGroup = groupSites.filter(s => (userData[s.id] || {}).status === "visited").length;

        headerEl.innerHTML = `
          <div class="location-title">
            <span class="location-name">${groupTitle}</span>
            <span class="location-counter">${visitedInGroup} / ${groupSites.length} visited</span>
          </div>
          <span class="chevron">▼</span>
        `;

        const contentEl = document.createElement("div");
        contentEl.className = "location-content";

        groupSites.forEach(site => {
          const u = userData[site.id] || {};
          const status = u.status || "";

          const card = document.createElement("div");
          card.className = `site-card ${status}`;

          const isVisited = status === "visited";
          const isWishlist = status === "wishlist";
          const cachedImg = photoCache[site.id];

          card.innerHTML = `
            <div class="site-thumb-wrap" data-placeholder="${site.name}">
              <img id="img_${site.id}" class="site-thumb ${cachedImg ? 'loaded' : ''}" src="${cachedImg || ''}" alt="${site.name}" loading="lazy">
            </div>
            <div class="site-card-body">
              <div>
                <div class="site-name">${site.name}</div>
                <div class="site-meta">
                  <span class="site-category">${site.category}</span>
                  ${site.sub ? `<span class="site-sublocation">📍 ${site.sub}</span>` : ""}
                </div>
                <div>
                  <a href="${site.ntUrl}" target="_blank" rel="noopener noreferrer" class="nt-button">
                    🌐 View on National Trust &rarr;
                  </a>
                </div>
                ${isVisited && u.date ? `<div class="site-date-badge">✓ Visited: ${u.date}</div>` : ""}
              </div>
              <div class="site-actions">
                <button class="status-btn ${isVisited ? 'active-visited' : ''}" data-action="visited" data-id="${site.id}">
                  ${isVisited ? '✓ Visited' : 'Mark Visited'}
                </button>
                <button class="status-btn ${isWishlist ? 'active-wishlist' : ''}" data-action="wishlist" data-id="${site.id}">
                  ${isWishlist ? '★ Wishlist' : 'Wishlist'}
                </button>
              </div>
            </div>
          `;

          contentEl.appendChild(card);
        });

        headerEl.addEventListener("click", () => {
          headerEl.classList.toggle("open");
          contentEl.classList.toggle("hidden");
        });

        groupEl.appendChild(headerEl);
        groupEl.appendChild(contentEl);
        container.appendChild(groupEl);
      });

      loadAllPropertyPhotos();
    }

    // Card Button Delegation
    document.getElementById("siteListContainer").addEventListener("click", (e) => {
      const btn = e.target.closest(".status-btn");
      if (!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      setStatus(id, action);
    });

    // Filtering listeners
    document.getElementById("search").addEventListener("input", renderSites);
    document.getElementById("filterStatus").addEventListener("change", renderSites);
    document.getElementById("filterCategory").addEventListener("change", renderSites);
    document.getElementById("filterLocation").addEventListener("change", renderSites);

    // Export & Import Handlers
    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(userData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `national-trust-log-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("importBtn").addEventListener("click", () => {
      document.getElementById("importFile").click();
    });

    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const parsed = JSON.parse(event.target.result);
          if (typeof parsed === "object" && parsed !== null) {
            userData = parsed;
            saveState();
            renderSites();
            alert("Checklist progress restored successfully!");
          }
        } catch (err) {
          alert("Could not parse file. Please upload a valid JSON backup.");
        }
      };
      reader.readAsText(file);
    });

    // Start-up
    populateFilterDropdowns();
    updateStats();
    renderSites();
    renderAuthUI();
  </script>
</body>
</html>
